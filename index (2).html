<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAM'S Payment Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #4f46e5;
            --primary-dark: #4338ca;
            --primary-glow: rgba(79, 70, 229, 0.4);
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --input-bg: #f8fafc;
            --success: #10b981;
            --error: #ef4444;
            --glass-bg: rgba(255, 255, 255, 0.85);
            --glass-border: rgba(255, 255, 255, 0.6);
            --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }

        body {
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
            padding: 20px; overflow-x: hidden; background-color: #f3f4f6; position: relative;
        }

        .bg-animation {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;
            background: radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%), 
                        radial-gradient(at 50% 0%, hsla(225,39%,30%,1) 0, transparent 50%), 
                        radial-gradient(at 100% 0%, hsla(339,49%,30%,1) 0, transparent 50%);
            background-size: 200% 200%; animation: gradientBG 15s ease infinite;
        }
        .blob { position: absolute; filter: blur(80px); opacity: 0.6; animation: float 10s infinite ease-in-out; }
        .blob-1 { top: 10%; left: 10%; width: 300px; height: 300px; background: #6366f1; }
        .blob-2 { bottom: 20%; right: 10%; width: 250px; height: 250px; background: #ec4899; }
        @keyframes float { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(-20px, 20px); } }

        .container {
            width: 100%; max-width: 520px; background: var(--glass-bg);
            backdrop-filter: blur(20px); border: 1px solid var(--glass-border);
            border-radius: 24px; box-shadow: var(--shadow-xl); position: relative; overflow: hidden;
        }

        #toast-container { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 9999; display: flex; flex-direction: column; gap: 10px; }
        .toast {
            background: white; padding: 12px 20px; border-radius: 50px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
            display: flex; align-items: center; gap: 10px; font-size: 0.9rem; font-weight: 600; color: var(--text-main);
            animation: slideDown 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); border: 1px solid var(--border);
        }
        @keyframes slideDown { from { transform: translateY(-50px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        .header { text-align: center; padding: 40px 30px 20px; }
        .progress-bar { display: flex; justify-content: space-between; position: relative; margin: 10px 50px 30px; }
        .progress-line { position: absolute; top: 50%; left: 0; right: 0; height: 4px; background: #e2e8f0; z-index: 1; transform: translateY(-50%); }
        .progress-fill { position: absolute; top: 50%; left: 0; height: 4px; background: var(--primary); z-index: 1; transform: translateY(-50%); width: 0%; transition: width 0.5s ease; }
        .step-dot { width: 32px; height: 32px; background: white; border: 2px solid #e2e8f0; border-radius: 50%; z-index: 2; display: flex; align-items: center; justify-content: center; font-size: 0.85rem; font-weight: 700; color: var(--text-muted); }
        .step-dot.active { border-color: var(--primary); color: var(--primary); box-shadow: 0 0 0 4px var(--primary-glow); }
        .step-dot.completed { background: var(--primary); border-color: var(--primary); color: white; }

        .step-content { display: none; padding: 0 40px 40px; animation: fadeIn 0.4s ease; }
        .step-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .input-group { margin-bottom: 20px; position: relative; }
        .input-group label { display: block; font-size: 0.9rem; font-weight: 600; color: var(--text-main); margin-bottom: 8px; }
        .input-wrapper { position: relative; }
        .input-wrapper input { width: 100%; padding: 14px 16px 14px 45px; border: 2px solid transparent; background: var(--input-bg); border-radius: 12px; font-size: 1rem; transition: all 0.2s; }
        .input-wrapper input:focus { outline: none; background: white; border-color: var(--primary); box-shadow: 0 4px 12px var(--primary-glow); }
        .input-icon { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); }

        .qr-card { background: white; border-radius: 16px; padding: 20px; text-align: center; border: 1px solid #e2e8f0; margin-bottom: 25px; }
        .qr-image-wrap { background: #fff; padding: 10px; border-radius: 12px; border: 1px solid #f1f5f9; display: inline-block; margin-bottom: 10px; cursor: zoom-in; transition: transform 0.2s; }
        .qr-image-wrap:hover { transform: scale(1.02); }
        .upi-badge { display: inline-flex; align-items: center; gap: 8px; background: #f1f5f9; padding: 8px 16px; border-radius: 20px; font-size: 0.9rem; font-weight: 600; cursor: pointer; }

        .upload-box { border: 2px dashed #cbd5e1; border-radius: 16px; padding: 25px; text-align: center; cursor: pointer; background: rgba(255,255,255,0.5); margin-bottom: 20px; }
        #file-preview { max-height: 140px; border-radius: 12px; margin-top: 10px; display: none; margin-left: auto; margin-right: auto; }

        .btn { width: 100%; padding: 16px; border-radius: 12px; border: none; font-size: 1rem; font-weight: 700; cursor: pointer; transition: all 0.2s; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-ghost { background: transparent; color: var(--text-muted); margin-top: 10px; }

        .loader-wrap { position: absolute; inset: 0; background: rgba(255,255,255,0.9); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 50; backdrop-filter: blur(5px); display: none; }
        .spinner { width: 40px; height: 40px; border: 4px solid #e2e8f0; border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        /* Modal Styles */
        #qrModal {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); 
            z-index: 10000; align-items: center; justify-content: center; flex-direction: column; padding: 20px;
            backdrop-filter: blur(8px);
        }
        .modal-content {
            background: white; padding: 25px; border-radius: 24px; text-align: center; 
            max-width: 350px; width: 100%; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <div class="bg-animation"></div>
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <canvas id="confetti-canvas" style="position:fixed; top:0; left:0; pointer-events:none; z-index:99;"></canvas>
    <div id="toast-container"></div>

    <div id="qrModal" onclick="closeQRModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <h3 style="margin-bottom: 15px;">Scan to Pay</h3>
            <img id="modal-qr-img" src="" style="width:100%; border-radius:12px; margin-bottom:20px;">
            <button class="btn btn-primary" onclick="closeQRModal()">Got it</button>
        </div>
    </div>

    <div class="container">
        <div class="loader-wrap" id="loader">
            <div class="spinner"></div>
            <h4 style="margin-top:15px">Processing...</h4>
        </div>

        <div class="header">
            <h2>Sam's Payment</h2>
            <p>Complete the steps to verify payment.</p>
        </div>

        <div class="progress-bar">
            <div class="progress-line"></div>
            <div class="progress-fill" id="progress-fill"></div>
            <div class="step-dot active" id="dot-1">1</div>
            <div class="step-dot" id="dot-2">2</div>
            <div class="step-dot" id="dot-3">3</div>
        </div>

        <form id="mainForm" onsubmit="return false;">
            <div class="step-content active" id="step-1">
                <div class="input-group">
                    <label>Full Name</label>
                    <div class="input-wrapper"><span class="input-icon">👤</span><input type="text" id="name" placeholder="John Doe"></div>
                </div>
                <div class="input-group">
                    <label>Mobile Number</label>
                    <div class="input-wrapper"><span class="input-icon">📱</span><input type="tel" id="mobile" placeholder="98765 43210" maxlength="10"></div>
                </div>
                <div class="input-group">
                    <label>Email Address</label>
                    <div class="input-wrapper"><span class="input-icon">✉️</span><input type="email" id="email" placeholder="john@example.com"></div>
                </div>
                <button class="btn btn-primary" onclick="validateStep1()">Continue</button>
            </div>

            <div class="step-content" id="step-2">
                <div class="qr-card">
                    <h3 style="margin-bottom: 15px; color: var(--text-main);">Scan to Pay</h3>
                    <div class="qr-image-wrap" onclick="openQRModal()">
                        <img id="main-qr" src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=upi://pay?pa=sameer612r-2@okaxis&pn=Merchant&cu=INR" alt="QR">
                        <p style="font-size: 0.7rem; color: var(--text-muted); margin-top: 5px;">Tap to enlarge</p>
                    </div>
                    <div>
                        <div class="upi-badge" onclick="copyUPI()">
                            <span id="upi-id">sameer612r-2@okaxis</span> 📋
                        </div>
                    </div>
                </div>

                <div class="input-group">
                    <label>Amount Paid (₹)</label>
                    <div class="input-wrapper"><span class="input-icon">₹</span><input type="number" id="amount" placeholder="500"></div>
                </div>

                <div class="upload-box" onclick="document.getElementById('fileInput').click()">
                    <div id="upload-ui">
                        <p style="font-weight:600">Upload Screenshot</p>
                        <p style="font-size:0.8rem; color:var(--text-muted)">Tap to select image</p>
                    </div>
                    <img id="file-preview" alt="Preview">
                    <input type="file" id="fileInput" hidden accept="image/*">
                </div>

                <button class="btn btn-primary" onclick="submitToTelegram()">Complete Verification</button>
                <button class="btn btn-ghost" onclick="changeStep(1)">Back</button>
            </div>

            <div class="step-content" id="step-3">
                <div style="text-align:center">
                    <div style="font-size:50px; color:var(--success)">✓</div>
                    <h2>Payment Sent!</h2>
                    <p style="color:var(--text-muted); margin-top:10px">Your proof is being reviewed by our team.</p>
                    <button class="btn btn-primary" style="margin-top:30px" onclick="location.reload()">Done</button>
                </div>
            </div>
        </form>
    </div>

    <script>
        const BOT_TOKEN = '8575446959:AAEHRGzvr16lyx3GEnjCG37USLB7L2RNC78';
        const CHAT_ID = '7511065293';
        let currentStep = 1;
        let selectedFile = null;

        function validateStep1() {
            const name = document.getElementById('name').value;
            const mobile = document.getElementById('mobile').value;
            const email = document.getElementById('email').value;

            if(name.length < 3) return showToast('Enter valid name', 'error');
            if(mobile.length < 10) return showToast('Enter 10-digit mobile', 'error');
            // Strict email check
            if(!email || !email.includes('@') || email.length < 5) {
                return showToast('Valid email is required', 'error');
            }
            changeStep(2);
        }

        function changeStep(step) {
            document.querySelectorAll('.step-content').forEach(s => s.classList.remove('active'));
            document.getElementById(`step-${step}`).classList.add('active');
            const fill = document.getElementById('progress-fill');
            const dot1 = document.getElementById('dot-1');
            const dot2 = document.getElementById('dot-2');
            
            if(step === 2) {
                fill.style.width = '50%';
                dot1.classList.add('completed'); dot1.innerText = '✓';
                dot2.classList.add('active');
            } else {
                fill.style.width = '0%';
                dot1.classList.remove('completed'); dot1.innerText = '1';
                dot2.classList.remove('active');
            }
            currentStep = step;
        }

        // QR Modal Controls
        function openQRModal() {
            const modal = document.getElementById('qrModal');
            const modalImg = document.getElementById('modal-qr-img');
            const mainImg = document.getElementById('main-qr');
            modalImg.src = mainImg.src.replace('150x150', '400x400');
            modal.style.display = 'flex';
        }

        function closeQRModal() {
            document.getElementById('qrModal').style.display = 'none';
        }

        document.getElementById('fileInput').addEventListener('change', function(e) {
            selectedFile = e.target.files[0];
            if (selectedFile) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    document.getElementById('upload-ui').style.display = 'none';
                    const preview = document.getElementById('file-preview');
                    preview.src = e.target.result;
                    preview.style.display = 'block';
                };
                reader.readAsDataURL(selectedFile);
            }
        });

        async function submitToTelegram() {
            const amount = document.getElementById('amount').value;
            if(!amount) return showToast('Enter amount', 'error');
            if(!selectedFile) return showToast('Upload screenshot', 'error');

            document.getElementById('loader').style.display = 'flex';
            const caption = `💰 *New Payment Alert*\n👤 Name: ${document.getElementById('name').value}\n📱 Mobile: ${document.getElementById('mobile').value}\n✉️ Email: ${document.getElementById('email').value}\n💵 Amount: ₹${amount}`;

            const formData = new FormData();
            formData.append('chat_id', CHAT_ID);
            formData.append('photo', selectedFile);
            formData.append('caption', caption);
            formData.append('parse_mode', 'Markdown');

            try {
                const res = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, { method: 'POST', body: formData });
                if(res.ok) {
                    document.getElementById('loader').style.display = 'none';
                    changeStep(3);
                    fireConfetti();
                } else throw new Error();
            } catch (err) {
                document.getElementById('loader').style.display = 'none';
                showToast('Failed to send proof.', 'error');
            }
        }

        function showToast(msg, type='success') {
            const container = document.getElementById('toast-container');
            const t = document.createElement('div');
            t.className = `toast`;
            t.style.color = type === 'error' ? '#ef4444' : '#10b981';
            t.innerText = msg;
            container.appendChild(t);
            setTimeout(() => t.remove(), 3000);
        }

        function copyUPI() {
            navigator.clipboard.writeText('sameer612r-2@okaxis');
            showToast('UPI Copied');
        }

        function fireConfetti() {
            const canvas = document.getElementById('confetti-canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth; canvas.height = window.innerHeight;
            let parts = [];
            for(let i=0; i<40; i++) parts.push({x:Math.random()*canvas.width, y:-10, r:Math.random()*6+2, color: '#4f46e5'});
            function draw() {
                ctx.clearRect(0,0,canvas.width, canvas.height);
                parts.forEach(p => {
                    ctx.beginPath(); ctx.fillStyle = p.color; ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.fill();
                    p.y += 4;
                });
                if(parts[0].y < canvas.height) requestAnimationFrame(draw);
            }
            draw();
        }
    </script>
</body>
</html>
